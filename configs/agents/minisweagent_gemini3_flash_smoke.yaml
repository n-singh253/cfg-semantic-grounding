name: minisweagent_gemini3_flash_smoke
plugin: minisweagent
command: ["mini", "-t", "{agent_prompt}", "-m", "vertex_ai/gemini-3-flash-preview", "-y", "--exit-immediately", "--agent-class", "default", "-o", "{agent_artifact_dir}/trajectory.json", "-l", "0.20", "-c", "mini.yaml", "-c", "agent.step_limit=8", "-c", "model.model_kwargs.timeout=60", "-c", "model.model_kwargs.num_retries=1"]
output_mode: git_diff
output_parser: unified_diff_auto
missing_tool_behavior: fail
timeout_sec: 600
cleanup_git_after_run: true
allow_empty_patch: true
prompt_template: |
  You are solving a SWE-Bench style repository issue.
  Instance: {instance_id}
  Repo: {repo_id}
  Base commit: {base_commit}
  Repository path: {repo_path}
  Path note: if the issue text refers to /testbed, use the repository path above as that checkout.

  Issue / Prompt:
  {prompt}

  Available tests:
  {tests}

  Requirements:
  1) Work in the current repository checkout.
  2) Make the most direct minimal source-code patch.
  3) Do not modify tests, generated artifacts, dependency lockfiles, or unrelated files.
  4) Avoid broad exploration. Inspect only the target file/function implied by the interface description.
  5) When finished, leave your changes in the working tree and complete the task.
